<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 LED Control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 40px 36px;
    width: 320px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    color: #f1f5f9;
    font-size: 20px;
    margin: 0 0 24px;
    font-weight: 600;
  }
  .bulb {
    width: 90px;
    height: 90px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #334155;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .bulb.on {
    background: #facc15;
    box-shadow: 0 0 40px 10px rgba(250, 204, 21, 0.6);
  }
  .status {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  .status.on { color: #facc15; }
  .buttons { display: flex; gap: 12px; }
  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #onBtn { background: #22c55e; color: white; }
  #offBtn { background: #ef4444; color: white; }
  .hint {
    margin-top: 20px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="card">
  <h1>ESP32 LED Control</h1>
  <div class="bulb" id="bulb"></div>
  <div class="status" id="status">Checking status…</div>
  <div class="buttons">
    <button id="onBtn">Turn ON</button>
    <button id="offBtn">Turn OFF</button>
  </div>
  <div class="hint">Updates the shared Google Sheet. The ESP32 checks it every few seconds.</div>
</div>

<script>
  // PASTE your Google Apps Script Web App URL here (ends in /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmG5YBsHqgD403bS78KLte29OfHzm-S0kZUpe25dsnPY2FQGVSs0ws4ygUXuJ_HWI/exec";

  const bulb = document.getElementById('bulb');
  const statusEl = document.getElementById('status');
  const onBtn = document.getElementById('onBtn');
  const offBtn = document.getElementById('offBtn');

  function render(state) {
    const isOn = state === "ON";
    bulb.classList.toggle('on', isOn);
    statusEl.classList.toggle('on', isOn);
    statusEl.textContent = "Status: " + state;
  }

  async function getStatus() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      render(data.state);
    } catch (err) {
      statusEl.textContent = "Connection error";
      console.error(err);
    }
  }

  async function setStatus(state) {
    onBtn.disabled = true;
    offBtn.disabled = true;
    try {
      const res = await fetch(SCRIPT_URL + "?state=" + state);
      const data = await res.json();
      render(data.state);
    } catch (err) {
      statusEl.textContent = "Connection error";
      console.error(err);
    } finally {
      onBtn.disabled = false;
      offBtn.disabled = false;
    }
  }

  onBtn.addEventListener('click', () => setStatus('ON'));
  offBtn.addEventListener('click', () => setStatus('OFF'));

  getStatus();
  setInterval(getStatus, 4000); // keep UI in sync if changed elsewhere
</script>

</body>
</html>
