<!DOCTYPE html>
<html>
<head>

<style>

body {
    font-family: Arial;
    background: #f5f5f5;
}

.container {
    width: 850px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

select, input, button {

    margin: 5px;

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

th {
    background: #eee;
}

.total {
    font-size: 20px;
    font-weight: bold;
    text-align: right;
    margin-top: 10px;
}

button {
    cursor: pointer;
}

</style>
</head>

<body>

<option data-price="20">Bread sandwich (veg)</option>
<option data-price="13">Bread toast</option>
<option data-price="12">Steamed banana</option>
<option data-price="8">Nool puttu</option>
<option data-price="8">Puttu</option>
<option data-price="8">Appam/idiyappam</option>

</select>

<input type="number" id="qty" placeholder="Quantity" min="1">

<button onclick="addItem()">Add</button>

<table id="billTable">
<tr>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
<th>Remove</th>
</tr>
</table>

<div class="total">
Total Amount: ₹ <span id="grandTotal">0</span>
</div>

<button onclick="printBill()">Print Bill</button>

</div>

<script>

let grandTotal = 0;

function addItem() {

let product = document.getElementById("product");
let qty = document.getElementById("qty").value;

if (product.selectedIndex === 0 || qty === "") {
    alert("Select item and quantity");
    return;
}

let itemName = product.options[product.selectedIndex].text;
let price = product.options[product.selectedIndex].dataset.price;

let total = price * qty;

let table = document.getElementById("billTable");

let row = table.insertRow();

row.insertCell(0).innerHTML = itemName;
row.insertCell(1).innerHTML = price;
row.insertCell(2).innerHTML = qty;
row.insertCell(3).innerHTML = total;

let removeBtn = document.createElement("button");
removeBtn.innerHTML = "X";

removeBtn.onclick = function () {
    grandTotal -= total;
    document.getElementById("grandTotal").innerText = grandTotal;
    table.deleteRow(row.rowIndex);
};

row.insertCell(4).appendChild(removeBtn);

grandTotal += total;

document.getElementById("grandTotal").innerText = grandTotal;

document.getElementById("qty").value = "";

}

function printBill() {
    window.print();
}

</script>

</body>
</html>
