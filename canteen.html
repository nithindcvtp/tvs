<style>

.container {

</select>

<input type="text" id="qty" placeholder="Enter Quantity">

<button onclick="addItem()">Add Item</button>

<table id="billTable">

<tr>
<th>Item</th>
<th>₹</th>
<th>Qty</th>
<th>Total</th>
<th>X</th>
</tr>

</table>

<div class="total">
Total: ₹ <span id="grandTotal">0</span>
</div>

<button class="printBtn" onclick="printBill()">Print Bill</button>

</div>

<script>

let grandTotal = 0;

function addItem() {

let product = document.getElementById("product");
let qty = document.getElementById("qty").value;

if (product.selectedIndex === 0 || qty === "") {
    alert("Select item and enter quantity");
    return;
}

let itemName = product.options[product.selectedIndex].text;
let price = product.options[product.selectedIndex].dataset.price;

let total = price * qty;

let table = document.getElementById("billTable");

let row = table.insertRow();

row.insertCell(0).innerHTML = itemName;
row.insertCell(1).innerHTML = price;
row.insertCell(2).innerHTML = qty;
row.insertCell(3).innerHTML = total;

let btn = document.createElement("button");

btn.innerHTML = "X";
btn.className = "removeBtn";

btn.onclick = function () {
    grandTotal -= total;
    document.getElementById("grandTotal").innerText = grandTotal;
    table.deleteRow(row.rowIndex);
};

row.insertCell(4).appendChild(btn);

grandTotal += total;

document.getElementById("grandTotal").innerText = grandTotal;

document.getElementById("qty").value = "";

}

function printBill() {
    window.print();
}

</script>

</body>
