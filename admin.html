<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a program — Flash Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-row">
      <div class="brand">
        <span class="brand-mark">⏚</span>
        <h1>Flash Log</h1>
      </div>
      <a class="admin-link" href="index.html">Back to library</a>
    </div>
    <p class="tagline">Save a working program so future-you doesn't have to search for it again.</p>
  </header>

  <main>
    <div id="gate" class="gate">
      <label for="password-input">Admin password</label>
      <input type="password" id="password-input" autocomplete="current-password">
      <button type="button" id="unlock-btn">Unlock</button>
      <p id="gate-error" class="status status-error" hidden></p>
    </div>

    <form id="post-form" class="post-form" hidden>
      <label for="chip-select">Chip</label>
      <select id="chip-select"></select>

      <label for="title-input">Program title</label>
      <input type="text" id="title-input" required placeholder="e.g. Blink onboard LED">

      <label for="description-input">Description</label>
      <textarea id="description-input" rows="3" placeholder="What this does, what it needs wired up, anything future-you should know"></textarea>

      <label for="code-input">Program</label>
      <textarea id="code-input" class="code-input" rows="16" required spellcheck="false" placeholder="Paste your code here"></textarea>

      <button type="submit" id="submit-btn">Save program</button>
      <p id="form-status" class="status" hidden></p>
    </form>
  </main>

  <footer>
    Only share this page and its password with people you trust — anyone with both can add or see this form.
  </footer>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
